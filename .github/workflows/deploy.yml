name: QuizLY CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAME: kartikkamatkar/quizly

jobs:

  build:
    name: Build Spring Boot Services
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - api-gateway
          - auth-service
          - QuizService
          - attemptservice
          - competition-service
          - ai-service

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Service
        working-directory: ./${{ matrix.service }}
        run: |
          chmod +x mvnw || true

          if [ -f "./mvnw" ]; then
             ./mvnw clean package -DskipTests
          else
             mvn clean package -DskipTests
          fi

  docker:

    name: Publish Docker Images

    needs: build

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - api-gateway
          - auth-service
          - QuizService
          - attemptservice
          - competition-service
          - ai-service

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ matrix.service }}-latest
            ${{ env.IMAGE_NAME }}:${{ matrix.service }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max