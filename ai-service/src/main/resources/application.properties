spring.application.name=ai-service
server.port=6065

# Disable mocks to use the real RAG / Ollama integration
ai.mock.chat=false
ai.mock.vectorstore=false

spring.ai.openai.api-key=${OPENAI_API_KEY:da2aad15e08443d090ab371fa8a0682d.SDnNUzfLjwd8qIsd0od3nkoA}
spring.ai.openai.base-url=${OPENAI_BASE_URL:http://host.docker.internal:11435}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:llama3}
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:nomic-embed-text}

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/

# Actuator & Observability
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
